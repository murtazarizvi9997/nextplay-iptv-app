name: Build NEXT PLAY IPTV APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract App Project
        run: unzip -o NextPlayIPTV_Android_App.zip -d project_src
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        working-directory: project_src
        run: gradle assembleDebug
      - name: Upload NextPlayIPTV APK
        uses: actions/upload-artifact@v4
        with:
          name: NextPlayIPTV-Mobile-TV-APK
          path: project_src/app/build/outputs/apk/debug/app-debug.apk
